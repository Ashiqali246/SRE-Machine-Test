apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
  namespace: sre-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
        - name: cpu-stress
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting controlled CPU stress test"
              while true; do
                : 
              done
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
