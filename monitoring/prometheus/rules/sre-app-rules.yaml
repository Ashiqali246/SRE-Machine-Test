apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: sre-app-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: sre-app.rules
      rules:

        - alert: SREAppDown
          expr: sum(up{namespace="sre-app",job="sre-test-app"}) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "SRE application is down"
            description: "Prometheus cannot reach any SRE application instance for more than 1 minute."

        - alert: SREAppPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="sre-app",container="sre-test-app"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "SRE application container restarted"
            description: "An SRE application container has restarted during the last 5 minutes."

        - alert: SREAppHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="sre-app",container="sre-test-app"}[5m])) > 0.8
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "SRE application CPU usage is high"
            description: "The SRE application is consuming high CPU for more than 2 minutes."

        - record: sre_app:request_rate:5m
          expr: sum(rate(sre_app_requests_total[5m]))
